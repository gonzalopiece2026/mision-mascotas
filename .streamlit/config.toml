[theme]
primaryColor = "#4A90E2"          # Celeste/Azul vivo para botones y acentos
backgroundColor = "#E6F0FA"       # Fondo general: Celeste pastel suave y notorio (saca el blanco puro)
secondaryBackgroundColor = "#FFFFFF" # Fondo de tarjetas y desplegables: Blanco limpio para hacer contraste
textColor = "#1C2D42"             # Texto: Gris azulado oscuro muy legible
font = "sans serif"
